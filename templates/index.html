<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Resize & Cropper</title>
  <link rel="stylesheet" href="/static/style.css?v=20260903-marketplace-zip-1">
</head>
<body>
<div class="app">
  <header>
    <h1>Image Resize & Cropper</h1>
    <p>画像を指定サイズに合わせて、拡大・縮小・切り抜きできます。</p>
  </header>

  <main>
    <section class="panel upload-panel">
      <label id="dropZone" class="drop-zone">
        <input id="fileInput" type="file" accept="image/*">
        <div class="drop-icon">＋</div>
        <strong>画像を選択</strong>
        <span>クリックまたはドラッグ＆ドロップ</span>
      </label>
      <div id="fileInfo" class="file-info hidden"></div>
    </section>

    <section id="editor" class="editor hidden">
      <div class="preview-panel panel">
        <div class="panel-title">
          <span>プレビュー</span>
          <span id="zoomLabel">100%</span>
        </div>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="emptyPreview">画像を選択してください</div>
        </div>
        <div class="preview-help">
          ドラッグ：位置調整　／　ホイール：ズーム　／　「フィット」で自動調整
        </div>
        <div class="zoom-controls">
          <button id="zoomOut" type="button">−</button>
          <input id="zoomRange" type="range" min="100" max="500" value="100">
          <button id="zoomIn" type="button">＋</button>
          <button id="fitBtn" type="button">フィット</button>
          <button id="centerBtn" type="button">中央</button>
        </div>
      </div>

      <aside class="settings panel">
        <div class="panel-title">出力設定</div>

        <label>幅
          <div class="input-unit">
            <input id="outWidth" type="number" min="1" max="20000" value="1024">
            <span>px</span>
          </div>
        </label>

        <label>高さ
          <div class="input-unit">
            <input id="outHeight" type="number" min="1" max="20000" value="1024">
            <span>px</span>
          </div>
        </label>

        <label id="lockAspectLabel" class="check">
          <input id="lockAspect" type="checkbox" checked>
          <span>アスペクト比を維持</span>
        </label>

        <div id="generalPresetBlock">
          <div class="preset-title">プリセット</div>
          <div class="presets">
            <button type="button" data-size="512x512">512×512</button>
            <button type="button" data-size="768x768">768×768</button>
            <button type="button" data-size="1024x1024">1024×1024</button>
            <button type="button" data-size="1280x720">1280×720</button>
            <button type="button" data-size="1920x1080">1920×1080</button>
            <button type="button" data-size="1080x1920">1080×1920</button>
          </div>
        </div>

        <label>販売サイト用プリセット
          <select id="sitePreset">
            <option value="">使用しない（通常出力）</option>
            <option value="marketplace">FANZA + DLsite 一括出力</option>
          </select>
        </label>

        <div id="marketplaceControls" class="marketplace-controls hidden">
          <div class="preset-title">編集対象</div>

          <div class="marketplace-label">サービス</div>
          <div class="marketplace-tabs" id="marketplaceServiceTabs">
            <button type="button" data-service="FANZA">FANZA</button>
            <button type="button" data-service="DLsite">DLsite</button>
          </div>

          <div class="marketplace-label">画像種別</div>
          <div class="marketplace-tabs" id="marketplaceTypeTabs">
            <button type="button" data-image-type="package">パッケージ</button>
            <button type="button" data-image-type="thumbnail">サムネイル</button>
          </div>

          <div class="marketplace-current">
            <span>現在編集中</span>
            <strong id="marketplaceCurrentTarget">-</strong>
          </div>

          <div class="marketplace-targets" id="marketplaceTargetList">
            <div data-target-card="FANZA/package">
              <span>FANZA / パッケージ</span><strong>560×420</strong>
            </div>
            <div data-target-card="FANZA/thumbnail">
              <span>FANZA / サムネイル</span><strong>100×100</strong>
            </div>
            <div data-target-card="DLsite/package">
              <span>DLsite / パッケージ</span><strong>560×420</strong>
            </div>
            <div data-target-card="DLsite/thumbnail">
              <span>DLsite / サムネイル</span><strong>300×300</strong>
            </div>
          </div>
        </div>

        <hr>

        <label>出力形式
          <select id="format">
            <option value="PNG">PNG</option>
            <option value="JPEG" selected>JPEG</option>
            <option value="WEBP">WebP</option>
          </select>
        </label>

        <div id="qualityWrap" hidden></div>
        <input id="quality" type="hidden" value="100">

        <div class="info-box">
          <div>元画像</div>
          <strong id="sourceSize">-</strong>
          <div>クロップ範囲</div>
          <strong id="cropSize">-</strong>
          <div>出力</div>
          <strong id="outputSize">-</strong>
        </div>

        <button id="processBtn" class="primary" type="button">画像を生成・保存</button>
        <button id="marketplaceZipBtn" class="primary hidden" type="button">販売サイト用ZIPを生成</button>
        <button id="resetBtn" class="secondary" type="button">別の画像を選択</button>
        <div id="status" class="status"></div>
      </aside>
    </section>
  </main>
</div>
<script src="/static/app.js?v=20260903-marketplace-zip-1"></script>
</body>
</html>
